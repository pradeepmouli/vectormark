[project]
name = "vectormark"
version = "0.2.1"
description = "Deterministic logo idealizer — rendered logo raster to clean, editable, symmetric SVG."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["svg", "vectorization", "logo", "raster-to-vector", "image-tracing", "idealize"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "skia-python>=87.4",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/pradeepmouli/vectormark"
Repository = "https://github.com/pradeepmouli/vectormark"
Issues = "https://github.com/pradeepmouli/vectormark/issues"

[project.optional-dependencies]
# render-ΔE scored candidate selection (without it, selection falls back to the
# cascade-priority pick and warns once — see vectormark.score).
scoring = ["resvg-py>=0.1.7"]
# the MCP server (`vectormark-mcp`); only needed to expose vectormark over MCP.
server = ["mcp>=1.13"]
# skia-python is now a required dependency (promoted from optional).
# This empty extra is kept for backwards compatibility with any installs that
# reference `vectormark[skia]`.
skia = []
dev = [
    "pytest>=8.0",
    "vectormark[scoring,server]",
]

[project.scripts]
vectormark = "vectormark.cli:main"
vectormark-mcp = "vectormark.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectormark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
